line-length = 120
indent-width = 4
target-version = "py310"
output-format = "concise"
extend-exclude = [
    ".git", ".hg", ".cache", ".idea", ".mypy_cache", ".pytest_cache", ".ruff_cache",
    ".tox", ".venv*", ".vs", "*.egg-info", "venv", "__pycache__", "bin", "build",
    "cmake-build-*", "coverage", "dist", "htmlcov", "node_modules", "obj",
]

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RET504"]
ignore = ["B008", "B028", "B905", "F811"]

[format]
indent-style = "space"
quote-style = "double"
line-ending = "lf"
